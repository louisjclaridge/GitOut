# Push a tag like v0.2.0 to build signed Linux and Windows installers and
# publish a GitHub Release. tauri-action also uploads latest.json, which the
# in-app updater reads.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      # The updater compares against the app version, not the
      # tag, so a mismatch publishes a release that never shows up as an update.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          fi
      # GitHub browser sign-in is required; GitLab's is optional and falls
      # back to token sign-in or a client ID entered in Settings.
      - name: Check GitHub OAuth client ID is set
        if: vars.GITOUT_GITHUB_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::error::Repository variable GITOUT_GITHUB_CLIENT_ID is not set (Settings → Secrets and variables → Actions → Variables)"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Restores the cache warm-cache.yml builds on main. Saving here is
      # wasted time: a cache saved from a tag is never visible to other tags.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false
      - name: System dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Public OAuth client IDs baked into official builds for browser sign-in.
          GITOUT_GITHUB_CLIENT_ID: ${{ vars.GITOUT_GITHUB_CLIENT_ID }}
          GITOUT_GITLAB_CLIENT_ID: ${{ vars.GITOUT_GITLAB_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitOut ${{ github.ref_name }}
          releaseBody: See the assets below to download GitOut for your platform.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
