# Publish a GitHub Release with a new tag like v0.3.0 (Releases → Draft a new
# release → choose a tag → Publish). This workflow stamps that version into
# the app, builds signed Linux and Windows installers and uploads them to the
# release, along with the latest.json the in-app updater reads. Nothing needs
# bumping or committing in the repo first.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      # GitHub browser sign-in is required; GitLab's is optional and falls
      # back to token sign-in or a client ID entered in Settings.
      - name: Check GitHub OAuth client ID is set
        if: vars.GITOUT_GITHUB_CLIENT_ID == ''
        shell: bash
        run: |
          echo "::error::Repository variable GITOUT_GITHUB_CLIENT_ID is not set (Settings → Secrets and variables → Actions → Variables)"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      # Restores the cache warm-cache.yml builds on main. Saving here is
      # wasted time: a cache saved from a tag is never visible to other tags.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          save-if: false
      - name: System dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      # The updater compares against the app version, so it must come from the
      # release tag. The repo's own version is only used for dev builds.
      # Runs after the cache restore and npm ci so the edited lockfiles don't
      # change the cache key or trip npm's lockfile check.
      - name: Set app version from release tag
        shell: bash
        run: node scripts/sync-version.mjs "${{ github.event.release.tag_name }}"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Public OAuth client IDs baked into official builds for browser sign-in.
          GITOUT_GITHUB_CLIENT_ID: ${{ vars.GITOUT_GITHUB_CLIENT_ID }}
          GITOUT_GITLAB_CLIENT_ID: ${{ vars.GITOUT_GITLAB_CLIENT_ID }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: ${{ matrix.args }}
