# Push a tag like v0.2.0 to build signed Linux and Windows installers and
# publish a GitHub Release. tauri-action also uploads latest.json, which the
# in-app updater reads.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: System dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Public OAuth client IDs baked into official builds for browser sign-in.
          GITOUT_GITHUB_CLIENT_ID: ${{ vars.GITOUT_GITHUB_CLIENT_ID }}
          GITOUT_GITLAB_CLIENT_ID: ${{ vars.GITOUT_GITLAB_CLIENT_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: GitOut ${{ github.ref_name }}
          releaseBody: See the assets below to download GitOut for your platform.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
