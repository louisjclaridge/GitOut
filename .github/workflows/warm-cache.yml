# Builds the release profile on main so tag builds in release.yml can reuse
# the compiled dependencies. GitHub only lets a tag's run restore caches from
# that tag or the default branch, so caches saved by release runs are never
# reused. The cache key follows Cargo.lock and the Rust version, so this only
# needs to run when dependencies change, plus weekly to pick up new stable
# Rust and to stop the cache expiring after 7 days unused.
name: Warm release cache

on:
  push:
    branches: [main]
    paths:
      - src-tauri/Cargo.toml
      - src-tauri/Cargo.lock
      - .github/workflows/warm-cache.yml
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
      - name: System dependencies (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      # Same cargo invocation as tauri-action, without bundling or signing.
      - run: npx tauri build --no-bundle
